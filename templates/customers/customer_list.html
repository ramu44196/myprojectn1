<!DOCTYPE html>
<html>
<head>
    <title>Customer List</title>
</head>

<body>

<h1>Customer List</h1>

<a href="{% url 'add_customer' %}">Add Customer</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Company</th>
        <th>Address</th>
    </tr>

    {% for customer in customers %}
    <tr>
        <td>{{ customer.id }}</td>
        <td>{{ customer.name }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.phone }}</td>
        <td>{{ customer.company }}</td>
        <td>{{ customer.address }}</td>
        <td><a href="{% url 'edit_customer' customer.id %}">Edit</a>
            <a href="{% url 'delete_customer' customer.id %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="6">No customers found.</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
