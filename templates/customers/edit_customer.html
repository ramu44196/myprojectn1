<!DOCTYPE html>
<html>
<head>
    <title>Edit Customer</title>
</head>

<body>

<h1>Edit Customer</h1>

<form method="POST">

    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ customer.name }}" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" value="{{ customer.email }}" required>
    <br><br>

    <label>Phone:</label>
    <input type="text" name="phone" value="{{ customer.phone }}" required>
    <br><br>

    <label>Company:</label>
    <input type="text" name="company" value="{{ customer.company }}" required>
    <br><br>

    <label>Address:</label>
    <textarea name="address" required>{{ customer.address }}</textarea>
    <br><br>

    <button type="submit">Update Customer</button>

</form>

<br>

<a href="{% url 'customer_list' %}">Back to Customers</a>

</body>
</html>
